name: ci
on: [push, pull_request]

jobs:
  test:
    # Linux, deliberately: everything except the Apple Events layer is testable
    # off a Mac, and the tests that need osascript put a stub on PATH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -run=XXX -fuzz=FuzzDecode -fuzztime=60s ./internal/notestore
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet for darwin
        # The Apple Events layer only compiles on the build matrix below, but
        # vet catches darwin-only mistakes the linux run cannot see.
        run: GOOS=darwin go vet ./...

  scripts:
    # install.sh and uninstall.sh are never executed anywhere -- they need a Mac
    # with SIP off -- so at minimum they must parse and pass shellcheck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh uninstall.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: '.'

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      # Cross-compiled for the bridge Mac, which will not have a Go toolchain.
      - run: GOOS=darwin GOARCH=${{ matrix.arch }} go build ./...
